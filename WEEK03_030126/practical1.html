<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Food Distribution — Bootstrap Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
      body{
        background: linear-gradient(180deg,#f3f6fb 0%,#eef4f9 100%);
        min-height:100vh;
      }
      .app-header{
        background-image: linear-gradient(90deg, rgba(91,141,239,0.75), rgba(58,210,159,0.75)), url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1600&q=80');
        background-size: cover;
        background-position: center;
        color: white;
        border-radius: 0 0 12px 12px;
        box-shadow: inset 0 -40px 60px rgba(0,0,0,0.15);
      }
      .card-donation.fulfilled{opacity:.6;border-left:4px solid #4caf50}
      .small-help{font-size:.85rem;color:#f6fbff}
    </style>
  </head>
  <body>
    <header class="app-header py-3">
      <div class="container d-flex align-items-center gap-3">
        <i class="bi bi-box-seam fs-3"></i>
        <div>
          <h4 class="mb-0">Smart Food Distribution</h4>
          <div class="small-help">Responsive demo: grid, forms, buttons, modal, persistence</div>
        </div>
        <div class="ms-auto">
          <button id="clearAll" class="btn btn-sm btn-light text-danger">Clear All</button>
        </div>
      </div>
    </header>

    <main class="container py-4">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="row mb-3 g-3 align-items-center">
            <div class="col-sm-6">
              <input id="search" class="form-control" placeholder="Search by item, donor or address">
            </div>
            <div class="col-sm-6 text-sm-end">
              <div class="btn-group" role="group">
                <button id="filterAll" class="btn btn-outline-primary btn-sm active">All</button>
                <button id="filterPending" class="btn btn-outline-warning btn-sm">Pending</button>
                <button id="filterCollected" class="btn btn-outline-success btn-sm">Collected</button>
              </div>
            </div>
          </div>

          <div id="donationsGrid" class="row g-3">
            <!-- Cards injected here -->
          </div>
        </div>

        <div class="col-lg-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Add Donation</h5>
              <form id="donationForm" novalidate>
                <div class="mb-2">
                  <label class="form-label">Donor name</label>
                  <input required name="donor" class="form-control" placeholder="e.g., John Doe">
                  <div class="invalid-feedback">Donor name required.</div>
                </div>

                <div class="mb-2">
                  <label class="form-label">Item</label>
                  <input required name="item" class="form-control" placeholder="e.g., Bread, Vegetables">
                  <div class="invalid-feedback">Please enter item.</div>
                </div>

                <div class="row g-2 mb-2">
                  <div class="col-6">
                    <label class="form-label">Quantity</label>
                    <input required name="qty" type="number" min="1" class="form-control" value="1">
                    <div class="invalid-feedback">Quantity must be 1 or more.</div>
                  </div>
                  <div class="col-6">
                    <label class="form-label">Type</label>
                    <select required name="type" class="form-select">
                      <option value="Prepared">Prepared</option>
                      <option value="Raw">Raw</option>
                      <option value="Packaged">Packaged</option>
                    </select>
                  </div>
                </div>

                <div class="mb-2">
                  <label class="form-label">Pickup address</label>
                  <input required name="address" class="form-control">
                </div>

                <div class="mb-2">
                  <label class="form-label">Contact phone</label>
                  <input name="phone" class="form-control" placeholder="optional">
                </div>

                <div class="d-flex gap-2 mt-3">
                  <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-circle me-1"></i>Add</button>
                  <button type="reset" class="btn btn-outline-secondary w-100">Reset</button>
                </div>
              </form>
            </div>
          </div>

          <div class="mt-3 small text-muted">Tip: click "Collected" on a donation to mark it done.</div>
        </div>
      </div>
    </main>

    <!-- Confirm modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1">
      <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body text-center py-4">
            <p class="mb-3">Are you sure you want to delete this donation?</p>
            <div class="d-flex justify-content-center gap-2">
              <button id="confirmDelete" class="btn btn-danger btn-sm">Delete</button>
              <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Simple app state persisted in localStorage
      const KEY = 'sfd_donations_v1';
      let donations = JSON.parse(localStorage.getItem(KEY) || '[]');
      const grid = document.getElementById('donationsGrid');
      const form = document.getElementById('donationForm');
      const search = document.getElementById('search');
      const filterAll = document.getElementById('filterAll');
      const filterPending = document.getElementById('filterPending');
      const filterCollected = document.getElementById('filterCollected');
      const clearAll = document.getElementById('clearAll');
      let activeFilter = 'all';
      let toDeleteId = null;

      function save(){ localStorage.setItem(KEY, JSON.stringify(donations)); }

      function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

      function render(){
        const q = (search.value||'').toLowerCase();
        grid.innerHTML = '';
        const list = donations.filter(d => {
          if(activeFilter==='pending' && d.collected) return false;
          if(activeFilter==='collected' && !d.collected) return false;
          const combined = (d.donor+' '+d.item+' '+d.address).toLowerCase();
          return combined.includes(q);
        });

        if(list.length===0){
          grid.innerHTML = '<div class="col-12"><div class="alert alert-info mb-0">No donations yet.</div></div>';
          return;
        }

        list.reverse().forEach(d => {
          const col = document.createElement('div');
          col.className = 'col-md-6';
          col.innerHTML = `
            <div class="card card-donation ${d.collected? 'fulfilled' : ''} shadow-sm">
              <div class="card-body">
                <div class="d-flex align-items-start">
                  <div class="flex-grow-1">
                    <h6 class="mb-1">${escapeHtml(d.item)} <small class="text-muted">×${d.qty}</small></h6>
                    <div class="small text-muted">Donor: ${escapeHtml(d.donor)} · ${escapeHtml(d.type)}</div>
                    <div class="mt-2">${escapeHtml(d.address)}</div>
                    ${d.phone? `<div class="small text-muted mt-1">Contact: ${escapeHtml(d.phone)}</div>`: ''}
                  </div>
                  <div class="ms-3 text-end">
                    <div class="btn-group-vertical">
                      <button class="btn btn-sm ${d.collected? 'btn-success' : 'btn-outline-success'}" data-action="collect" data-id="${d.id}">
                        <i class="bi ${d.collected? 'bi-check2-circle' : 'bi-check-lg'}"></i>
                      </button>
                      <button class="btn btn-sm btn-outline-danger" data-action="delete" data-id="${d.id}"><i class="bi bi-trash"></i></button>
                    </div>
                  </div>
                </div>
              </div>
            </div>`;
          grid.appendChild(col);
        });
      }

      function escapeHtml(s){ return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

      // Form submit
      form.addEventListener('submit', e => {
        e.preventDefault();
        if(!form.checkValidity()){
          form.classList.add('was-validated');
          return;
        }
        const data = Object.fromEntries(new FormData(form).entries());
        const entry = {
          id: uid(),
          donor: data.donor.trim(),
          item: data.item.trim(),
          qty: Number(data.qty) || 1,
          type: data.type,
          address: data.address.trim(),
          phone: (data.phone||'').trim(),
          collected: false,
          created: Date.now()
        };
        donations.push(entry);
        save();
        form.reset();
        form.classList.remove('was-validated');
        render();
      });

      // delegate buttons
      grid.addEventListener('click', e => {
        const btn = e.target.closest('button');
        if(!btn) return;
        const action = btn.dataset.action;
        const id = btn.dataset.id;
        if(action==='collect'){
          const item = donations.find(x=>x.id===id);
          if(item){ item.collected = !item.collected; save(); render(); }
        } else if(action==='delete'){
          toDeleteId = id;
          const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
          modal.show();
        }
      });

      document.getElementById('confirmDelete').addEventListener('click', ()=>{
        if(!toDeleteId) return;
        donations = donations.filter(x=>x.id!==toDeleteId);
        save(); render(); toDeleteId = null;
        bootstrap.Modal.getInstance(document.getElementById('confirmModal')).hide();
      });

      // filters and search
      search.addEventListener('input', ()=>render());
      filterAll.addEventListener('click', ()=>{ activeFilter='all'; setActive(filterAll); render(); });
      filterPending.addEventListener('click', ()=>{ activeFilter='pending'; setActive(filterPending); render(); });
      filterCollected.addEventListener('click', ()=>{ activeFilter='collected'; setActive(filterCollected); render(); });
      clearAll.addEventListener('click', ()=>{ if(confirm('Clear all donations?')){ donations=[]; save(); render(); } });

      function setActive(el){ [filterAll,filterPending,filterCollected].forEach(b=>b.classList.remove('active')); el.classList.add('active'); }

      // seed demo items if empty
      if(donations.length===0){
        donations.push({id:uid(), donor:'Community Kitchen', item:'Sandwiches', qty:40, type:'Prepared', address:'123 Market St', phone:'', collected:false, created:Date.now()});
        donations.push({id:uid(), donor:'Grocery Coop', item:'Canned Beans', qty:120, type:'Packaged', address:'45 Elm Ave', phone:'', collected:true, created:Date.now()});
        save();
      }

      render();
    </script>
  </body>
</html>
