<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Feast Restaurant</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    font-family: Arial, sans-serif;
}

/* HERO SECTION */
.hero {
    background: url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092') center/cover no-repeat;
    height: 500px;
    color: white;
}
.hero-overlay {
    background: rgba(0,0,0,0.6);
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
}

/* FIX CARD IMAGE SIZE */
.card img {
    height: 250px;
    object-fit: cover;
}

.section-title {
    margin-top: 60px;
    margin-bottom: 30px;
}
</style>

</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Royal Feast</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#menu">Menu</a></li>
        <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- HERO -->
<div class="hero">
  <div class="hero-overlay">
    <h1 class="display-3">Welcome to Royal Feast</h1>
    <p class="lead">Taste the best dishes from around the world</p>
    <button class="btn btn-warning btn-lg">Book a Table</button>
  </div>
</div>

<!-- BREADCRUMB -->
<div class="container mt-4">
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item active">Home</li>
      <li class="breadcrumb-item"><a href="#menu">Menu</a></li>
      <li class="breadcrumb-item"><a href="#contact">Contact</a></li>
    </ol>
  </nav>
</div>

<!-- MENU SECTION -->
<div class="container" id="menu">
  <h2 class="text-center section-title">Our Special Menu</h2>
  <div class="row g-4">

    <!-- Cheese Burger -->
    <div class="col-md-4">
      <div class="card h-100">
        <img src="https://images.unsplash.com/photo-1550547660-d9450f859349" class="card-img-top">
        <div class="card-body text-center">
          <h5 class="card-title">Cheese Burger</h5>
          <p>$12</p>
          <button class="btn btn-danger">Order Now</button>
        </div>
      </div>
    </div>

    <!-- Grilled Chicken -->
    <div class="col-md-4">
      <div class="card h-100">
        <img src="https://images.unsplash.com/photo-1544025162-d76694265947" class="card-img-top">
        <div class="card-body text-center">
          <h5 class="card-title">Grilled Chicken</h5>
          <p>$18</p>
          <button class="btn btn-success">Order Now</button>
        </div>
      </div>
    </div>

    <!-- Italian Pasta with Multiple Images -->
    <div class="col-md-4">
      <div class="card h-100">

        <!-- Bootstrap Carousel inside Card -->
        <div id="pastaCarousel" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-inner">

            <div class="carousel-item active">
              <img src="https://images.unsplash.com/photo-1604908812743-2a66b6c81f9c" class="d-block w-100">
            </div>

            <div class="carousel-item">
              <img src="https://images.unsplash.com/photo-1525755662778-989d0524087e" class="d-block w-100">
            </div>

            <div class="carousel-item">
              <img src="https://images.unsplash.com/photo-1473093226795-af9932fe5856" class="d-block w-100">
            </div>

          </div>
        </div>

        <div class="card-body text-center">
          <h5 class="card-title">Italian Pasta</h5>
          <p>$15</p>
          <button class="btn btn-primary">Order Now</button>
        </div>

      </div>
    </div>

  </div>
</div>

<!-- CONTACT SECTION -->
<div class="container" id="contact">
  <h2 class="text-center section-title">Contact Us</h2>

  <form>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" class="form-control" placeholder="Enter your name">
      </div>

      <div class="col-md-6 mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" placeholder="Enter your email">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Message</label>
      <textarea class="form-control" rows="4"></textarea>
    </div>

    <button type="submit" class="btn btn-dark">Send Message</button>
  </form>
</div>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-5">
  © 2026 Royal Feast Restaurant | Designed with Bootstrap
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
