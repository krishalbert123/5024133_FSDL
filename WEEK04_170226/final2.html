<!DOCTYPE html>
<html>
<head>
    <title>Hotel Reservation System</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .rooms {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .room-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            width: 30%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .room-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        input, select, button {
            padding: 8px;
            margin: 5px 0;
            width: 100%;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }

        .booking-list {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>🏨 Hotel Room Reservation</h1>

<div class="rooms">
    <div class="room-card">
        <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945" alt="Single Room">
        <h3>Single Room</h3>
        <p>Price: $100/night</p>
    </div>

    <div class="room-card">
        <img src="https://images.unsplash.com/photo-1590490360182-c33d57733427" alt="Double Room">
        <h3>Double Room</h3>
        <p>Price: $180/night</p>
    </div>

    <div class="room-card">
        <img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b" alt="Suite">
        <h3>Suite</h3>
        <p>Price: $300/night</p>
    </div>
</div>

<h2>Book a Room</h2>

<input type="text" id="name" placeholder="Enter your name">
<select id="roomType">
    <option value="">Select Room Type</option>
    <option value="Single">Single</option>
    <option value="Double">Double</option>
    <option value="Suite">Suite</option>
</select>

<label>Check-in Date:</label>
<input type="date" id="checkin">

<label>Check-out Date:</label>
<input type="date" id="checkout">

<button onclick="bookRoom()">Book Now</button>

<p id="message"></p>

<div class="booking-list">
    <h3>Booking Records</h3>
    <ul id="bookings"></ul>
</div>

<script>

let reservations = []; // Array to store bookings

function bookRoom() {
    try {
        let name = document.getElementById("name").value.trim();
        let roomType = document.getElementById("roomType").value;
        let checkin = new Date(document.getElementById("checkin").value);
        let checkout = new Date(document.getElementById("checkout").value);
        let today = new Date();

        // VALIDATIONS
        if (name === "") throw "Name is required!";
        if (roomType === "") throw "Please select a room type!";
        if (isNaN(checkin) || isNaN(checkout)) throw "Please select valid dates!";
        if (checkin < today.setHours(0,0,0,0)) throw "Check-in cannot be in the past!";
        if (checkout <= checkin) throw "Check-out must be after check-in!";

        // Check for double booking
        for (let booking of reservations) {
            if (
                booking.roomType === roomType &&
                ((checkin >= booking.checkin && checkin < booking.checkout) ||
                 (checkout > booking.checkin && checkout <= booking.checkout))
            ) {
                throw "Room already booked for selected dates!";
            }
        }

        // Calculate total nights
        let timeDiff = checkout - checkin;
        let nights = timeDiff / (1000 * 60 * 60 * 24);

        let prices = {
            "Single": 100,
            "Double": 180,
            "Suite": 300
        };

        let totalPrice = nights * prices[roomType];

        // Add to array
        reservations.push({
            name,
            roomType,
            checkin,
            checkout,
            totalPrice
        });

        document.getElementById("message").innerHTML =
            `<span class="success">Booking successful! Total: $${totalPrice}</span>`;

        displayBookings();

    } catch (error) {
        document.getElementById("message").innerHTML =
            `<span class="error">${error}</span>`;
    }
}

function displayBookings() {
    let bookingList = document.getElementById("bookings");
    bookingList.innerHTML = "";

    reservations.forEach((booking, index) => {
        let li = document.createElement("li");

        li.innerText =
            `${booking.name} booked ${booking.roomType} Room | 
            ${booking.checkin.toDateString()} - ${booking.checkout.toDateString()} 
            | Total: $${booking.totalPrice}`;

        bookingList.appendChild(li);
    });
}

</script>

</body>
</html>
